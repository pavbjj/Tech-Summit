apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: p-kuligowski
data:
  config.yaml: |
    model_list:
      - model_name: auto
        litellm_params:
          model: ollama/llama3.2
          api_base: http://10.171.176.134:11434
        model_info:
          id: llama3.2-deployment

      - model_name: auto
        litellm_params:
          model: ollama/qwen2.5:1.5b
          api_base: http://10.171.176.134:11434
        model_info:
          id: qwen2.5-1.5b-deployment

      - model_name: llama3.2
        litellm_params:
          model: ollama/llama3.2
          api_base: http://10.171.176.134:11434

      - model_name: qwen2.5-1.5b
        litellm_params:
          model: ollama/qwen2.5:1.5b
          api_base: http://10.171.176.134:11434

      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://10.171.176.134:11434

    litellm_settings:
      drop_params: true

    router_settings:
      routing_strategy: "simple-shuffle"
      num_retries: 2
      allowed_fails: 3
      cooldown_time: 30

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
